[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-suite"
version = "0.0.1.dev0"
description = "Declarative workflow system for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "S1933" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
agentic = "agentic_suite.cli:main"

[project.urls]
"Source" = "https://github.com/S1933/AgenticSuite"
"Issues" = "https://github.com/S1933/AgenticSuite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_suite" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "lint_rule: tests of individual workflow lint rules (ADR 0003)",
    "verification: tests of check types (ADR 0003 D3)",
    "refusal: tests of schema refusals",
    "session: tests of session journal persistence (ADR 0004)",
    "e2e: end-to-end tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:yaml",
]